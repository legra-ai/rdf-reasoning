name: Conventional Commits
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]
permissions:
  pull-requests: read
jobs:
  title:
    name: Conventional Commit
    runs-on: ubuntu-latest
    steps:
      # Trusted metadata-only action: never check out or execute PR code here.
      - uses: legra-ai/github-actions/.github/actions/conventional-commit@1a9eff74bf5bd115f40730e9f5e183fa27444de0
