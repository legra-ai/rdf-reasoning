[package]
name = "rdf-reasoning"
version = "0.1.0"
description = "Portable RDF reasoning rules and explicit entailment preset contracts"
authors = ["Jacobus Geluk <jacobus.geluk@dataroad.com>"]
edition = "2024"
rust-version = "1.99.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/legra-ai/rdf-reasoning"
documentation = "https://docs.rs/rdf-reasoning"
readme = "README.md"
keywords = ["rdf", "rdfs", "datalog", "reasoning"]
categories = ["data-structures", "science"]
build = "build.rs"
include = ["Cargo.toml", "build.rs", "README.md", "LICENSE-APACHE", "LICENSE-MIT", "src/**/*.rs", "tests/**/*.rs"]

[dependencies]
datalog-structural-model = "=1.0.0"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }

[build-dependencies]
rhusky = "0.0.6"

[lints.rust]
missing_docs = "deny"

[lints.clippy]
all = "deny"
